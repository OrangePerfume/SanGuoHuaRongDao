name: Test (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      checkout_ref: ${{ github.sha }}
      publish_codeql: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Build environment creation failed" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $PWD '.venv\Scripts') -Encoding utf8
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Install game and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit installed dependencies (pip-audit)
        shell: pwsh
        run: |
          $auditDir = Join-Path $env:RUNNER_TEMP 'hrd-audit'
          python -m venv $auditDir
          if ($LASTEXITCODE -ne 0) { throw "Audit environment creation failed" }
          $auditPython = Join-Path $auditDir 'Scripts\python.exe'
          & $auditPython -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { throw "Audit tool installation failed" }
          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $site)) { throw "Build dependency path unavailable" }
          & $auditPython -m pip_audit --strict --path $site --progress-spinner off
          if ($LASTEXITCODE -ne 0) { throw "Dependency vulnerability audit failed" }
      - name: Test game engine, resources, and Qt GUI
        run: python -X faulthandler tools/run_tests.py --require-qt
